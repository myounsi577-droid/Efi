# Deploiement du site via GitHub Actions.
#
# A n'utiliser que si Pages est regle sur la source "GitHub Actions".
# Si Pages est regle sur "Deploy from a branch" (dossier /docs), ce workflow
# est inutile: GitHub publie le dossier tout seul a chaque push.
#
# Il ne se declenche donc pas automatiquement: le lancer a la main depuis
# l'onglet Actions une fois Pages active.
name: Publier le site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerer la page depuis les donnees
        run: python tools/make_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deployer
        id: deploiement
        uses: actions/deploy-pages@v4

      - name: Adresse du site
        run: echo "Site en ligne ${{ steps.deploiement.outputs.page_url }}"
